<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dev Notes</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><p class="eyebrow">PORTFOLIO DEMO</p><h1>Dev Notes</h1><p class="sub">A tiny notes API with persistent SQLite storage.</p></header><form id="note-form"><label for="title">标题</label><input id="title" maxlength="120" required placeholder="例如：缓存策略复盘"><label for="body">内容</label><textarea id="body" maxlength="5000" rows="4" placeholder="记录一个想法..."></textarea><button>保存笔记</button><p id="message" role="status"></p></form><section><h2>最近笔记</h2><div id="notes"></div></section></main><script type="module" src="app.js"></script></body></html>
